[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-signal-hub"
version = "0.1.0"
description = "Observe-only Telegram signal ingestion and read-only MCP queries"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==1.30.0"]

[project.scripts]
trading-signal-hub = "trading_signal_hub.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
