[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metatrader-mcp-server"
version = "0.7.0"
authors = [
  { name = "Aria Dhanang", email = "ariadng@gmail.com" },
]
description = "Model Context Protocol (MCP) server built with Python to enable AI LLMs to trade using MetaTrader platform."
readme = "README.md"
requires-python = ">=3.10"
license = { file="LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Upper bounds exclude untested major versions (mcp 2.x removed FastMCP).
# Exact tested versions are recorded in uv.lock.
dependencies = [
  "python-dotenv>=1.1.0,<2",
  "MetaTrader5>=5.0.45,<6",
  "numpy>=2.2.4,<3",
  "pandas>=2.2.3,<3",
  "tabulate>=0.9.0,<1",
  "fastapi>=0.115.12,<1",
  "uvicorn[standard]>=0.34.1,<1",
  "pydantic>=2.11.3,<3",
  "pydantic-settings>=2.8.1,<3",
  "mcp[cli]>=1.25.0,<2",
  "click>=8.0.0,<9",
  "pytz",
  "websockets>=13.0,<18",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["metatrader_mcp*", "metatrader_client*", "metatrader_openapi*", "metatrader_quote*"]

[project.urls]
"Homepage" = "https://github.com/ariadng/metatrader-mcp-server"
"Bug Tracker" = "https://github.com/ariadng/metatrader-mcp-server/issues"

[project.optional-dependencies]
client = []
dev = [
  "pytest>=8.3.5,<10",
  "httpx>=0.24.0,<1",
  "anyio>=4,<5",
  "build>=1.2.2.post1",
]

[project.scripts]
"metatrader-mcp-server" = "metatrader_mcp.cli:main"
"metatrader-http-server" = "metatrader_openapi.main:main"
"metatrader-quote-server" = "metatrader_quote.cli:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a running MetaTrader 5 terminal logged in to a dedicated demo account (set MT5_RUN_INTEGRATION=1)",
]
